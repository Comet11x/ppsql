[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppsql"
dynamic = ["version"]
description = "A preprocessor for SQL files: variables, includes and comments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["sql", "preprocessor", "templating", "cli"]
authors = [
  { name = "comet11x", email = "comet11x@protonmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.scripts]
ppsql = "ppsql.cli:main"

[project.urls]
Documentation = "https://github.com/comet11x/ppsql#readme"
Issues = "https://github.com/comet11x/ppsql/issues"
Source = "https://github.com/comet11x/ppsql"

[tool.hatch.version]
path = "src/ppsql/__about__.py"

[tool.hatch.envs.default]
dependencies = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest -v --cov=ppsql --cov=tests {args:tests}"
cov-report = "coverage combine && coverage html"

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "ruff>=0.6.0",
]
[tool.hatch.envs.lint.scripts]
check = [
  "ruff format --check --diff {args:src tests}",
  "ruff check {args:src tests}",
]
fix = [
  "ruff format {args:src tests}",
  "ruff check --fix {args:src tests}",
]

[tool.hatch.envs.types]
dependencies = [
  "mypy>=1.11.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/ppsql tests}"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "B008", # function call in default argument
  "E741", # ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["ppsql", "tests"]
branch = true
parallel = true
omit = [
  "src/ppsql/__about__.py",
]

[tool.coverage.paths]
ppsql = ["src/ppsql", "*/ppsql/src/ppsql"]
tests = ["tests", "*/ppsql/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
